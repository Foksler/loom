# Structured Logging Configuration for Loom
# Supports JSON logging with tracing and spans

# Log level configuration
log_levels:
  default: info
  overrides:
    loom: debug
    loom_server: info
    loom_core: info
    tokio: warn
    hyper: warn
    reqwest: info

# Output configuration
outputs:
  # Console output (development)
  console:
    enabled: true
    format: json
    level: debug
    target: stdout

  # File output (production)
  file:
    enabled: true
    path: /var/log/loom/loom.log
    level: info
    rotation:
      type: size
      max_size: 100M
      max_backups: 10
      compress: gzip
    format: json

  # Error file
  error_file:
    enabled: true
    path: /var/log/loom/loom-error.log
    level: warn
    rotation:
      type: daily
      max_days: 30
      compress: gzip
    format: json

  # Audit log (security events)
  audit:
    enabled: true
    path: /var/log/loom/loom-audit.log
    level: info
    rotation:
      type: size
      max_size: 50M
      max_backups: 20
    format: json
    fields:
      - timestamp
      - level
      - event_type
      - user_id
      - resource_id
      - action
      - status
      - client_ip
      - user_agent

# JSON output fields
json_fields:
  # Standard fields
  timestamp: "timestamp"
  level: "level"
  message: "message"
  module: "module"
  file: "file"
  line: "line"
  
  # Context fields
  trace_id: "trace_id"
  span_id: "span_id"
  parent_span_id: "parent_span_id"
  
  # Request fields
  request_id: "request_id"
  method: "method"
  path: "path"
  status: "status"
  duration_ms: "duration_ms"
  
  # Error fields
  error: "error"
  error_code: "error_code"
  error_details: "error_details"
  
  # Custom fields
  user_id: "user_id"
  session_id: "session_id"
  client_ip: "client_ip"

# Sampling configuration
sampling:
  # Enable sampling to reduce log volume in production
  enabled: true
  
  # Sample rate by level
  rates:
    debug: 0.1      # 10% of debug logs
    info: 0.5       # 50% of info logs
    warn: 1.0       # 100% of warnings
    error: 1.0      # 100% of errors
  
  # Sample rate by module
  module_rates:
    loom_core: 1.0           # Always log core module
    loom_http_retry: 0.1     # Sample HTTP retries
    tokio: 0.05              # Sample tokio events

# Filtering
filters:
  # Exclude patterns
  exclude:
    - pattern: ".*health.*"
      level: debug
    - pattern: ".*metrics.*"
      level: debug
  
  # Include high-priority patterns
  include:
    - pattern: ".*error.*"
    - pattern: ".*failure.*"
    - pattern: ".*panic.*"

# Enrichment
enrichment:
  # Add environment information
  enabled: true
  fields:
    environment: "${ENVIRONMENT}"
    version: "${APP_VERSION}"
    hostname: "${HOSTNAME}"
    region: "${REGION}"
  
  # Add request context
  request_context:
    enabled: true
    include_headers:
      - x-request-id
      - x-correlation-id
      - user-agent
      - referer

# Performance configuration
performance:
  # Buffer size for async logging
  buffer_size: 10000
  
  # Flush interval (ms)
  flush_interval: 1000
  
  # Number of worker threads
  worker_threads: 2
  
  # Maximum queue size before blocking
  max_queue_size: 100000

# Sensitive data redaction
redaction:
  enabled: true
  
  # Fields to redact
  fields:
    - password
    - token
    - api_key
    - secret
    - bearer
    - authorization
    - x-api-key
    - x-auth-token
  
  # Patterns to redact
  patterns:
    - regex: '"password":\s*"[^"]*"'
      replacement: '"password":"***REDACTED***"'
    - regex: 'Authorization:\s*Bearer\s+\S+'
      replacement: 'Authorization: Bearer ***REDACTED***'
    - regex: '"api_key":\s*"[^"]*"'
      replacement: '"api_key":"***REDACTED***"'
  
  # Hash sensitive values instead of redacting
  hash_fields:
    - email
    - phone_number
    - user_id

# OpenTelemetry integration
otel:
  enabled: true
  
  # Trace exporter
  traces:
    enabled: true
    exporter: jaeger
    endpoint: "http://localhost:14268/api/traces"
    sample_rate: 0.1
  
  # Metrics exporter
  metrics:
    enabled: true
    exporter: prometheus
    endpoint: "/metrics"
    interval_ms: 60000
  
  # Logs exporter
  logs:
    enabled: true
    exporter: otlp
    endpoint: "http://localhost:4317"

# Alert thresholds
alerts:
  enabled: true
  
  # Error rate threshold (%)
  error_rate_threshold: 5
  
  # Response time threshold (ms)
  response_time_threshold: 5000
  
  # Failed requests threshold
  failed_requests_threshold: 10
  
  # Alert channels
  channels:
    - type: email
      enabled: false
      recipients:
        - ops@example.com
    
    - type: slack
      enabled: false
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channel: "#loom-alerts"
    
    - type: pagerduty
      enabled: false
      integration_key: "${PAGERDUTY_KEY}"

# Compliance logging
compliance:
  enabled: true
  
  # Log retention (days)
  retention_days: 90
  
  # GDPR compliance
  gdpr:
    enabled: true
    anonymize_after_days: 30
    delete_after_days: 90
  
  # PII detection and handling
  pii_detection:
    enabled: true
    redact_pii: true
    log_detection: true

# Debug logging
debug:
  # Enable debug mode (development only)
  enabled: false
  
  # Log entry/exit of functions
  log_function_calls: false
  
  # Log variable values
  log_variables: false
  
  # Log timing information
  log_timing: true
