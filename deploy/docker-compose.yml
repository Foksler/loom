version: '3.9'

# Loom Docker Compose Configuration
# Production-ready multi-service setup

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: loom-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-loom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-loom}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-loom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - loom-network
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: loom-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - loom-network
    security_opt:
      - no-new-privileges:true

  # Loom Server
  loom-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: loom-server:${APP_VERSION:-latest}
    container_name: loom-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Application
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: json
      
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      
      # Database
      DATABASE_URL: postgresql://${DB_USER:-loom}:${DB_PASSWORD:-change-me}@postgres:5432/${DB_NAME:-loom}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      
      # Cache
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379
      
      # API Keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY}
      
      # Monitoring
      METRICS_ENABLED: "true"
      METRICS_PORT: "9090"
      
      # Security
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HTTPS_REDIRECT: ${HTTPS_REDIRECT:-false}
      
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - loom_config:/etc/loom
      - loom_data:/var/lib/loom
      - ./logs:/var/log/loom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - loom-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: loom-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - loom-server
    networks:
      - loom-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: loom-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/loom.json
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - loom-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Jaeger Tracing (Optional)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: loom-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:14268:14268"   # Collector
    volumes:
      - jaeger_data:/badger
    networks:
      - loom-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: loom-nginx
    depends_on:
      - loom-server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - nginx_cache:/var/cache/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - loom-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  loom_config:
    driver: local
  loom_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  jaeger_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  loom-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
