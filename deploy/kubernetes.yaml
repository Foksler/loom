---
# Kubernetes Deployment for Loom
# Production-ready manifests for deploying Loom to Kubernetes

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: loom
  labels:
    name: loom

---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: loom-config
  namespace: loom
data:
  RUST_LOG: "info"
  LOG_FORMAT: "json"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  DATABASE_MAX_CONNECTIONS: "20"
  DATABASE_MIN_CONNECTIONS: "5"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: loom-secrets
  namespace: loom
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/loom"
  REDIS_URL: "redis://:password@redis:6379"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GITHUB_PRIVATE_KEY: ""

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loom-postgres
  namespace: loom
spec:
  serviceName: loom-postgres
  replicas: 1
  selector:
    matchLabels:
      app: loom-postgres
  template:
    metadata:
      labels:
        app: loom-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: loom
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: loom-secrets
              key: DATABASE_URL
        - name: POSTGRES_DB
          value: loom
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U loom
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U loom
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: loom-postgres
  namespace: loom
spec:
  clusterIP: None
  selector:
    app: loom-postgres
  ports:
  - port: 5432
    targetPort: 5432

---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loom-redis
  namespace: loom
spec:
  serviceName: loom-redis
  replicas: 1
  selector:
    matchLabels:
      app: loom-redis
  template:
    metadata:
      labels:
        app: loom-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - "--appendonly"
        - "yes"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli ping
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: loom-redis
  namespace: loom
spec:
  clusterIP: None
  selector:
    app: loom-redis
  ports:
  - port: 6379
    targetPort: 6379

---
# Loom Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-server
  namespace: loom
  labels:
    app: loom-server
    version: "0.1.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: loom-server
  template:
    metadata:
      labels:
        app: loom-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - loom-server
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: loom-server
        image: loom-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        envFrom:
        - configMapRef:
            name: loom-config
        - secretRef:
            name: loom-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
      terminationGracePeriodSeconds: 30

---
# Loom Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: loom-server
  namespace: loom
  labels:
    app: loom-server
spec:
  type: ClusterIP
  selector:
    app: loom-server
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loom-ingress
  namespace: loom
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - loom.example.com
    secretName: loom-tls-cert
  rules:
  - host: loom.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: loom-server
            port:
              number: 8080

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loom-server-hpa
  namespace: loom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loom-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loom-server-pdb
  namespace: loom
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: loom-server

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loom-server
  namespace: loom
  labels:
    app: loom-server
spec:
  selector:
    matchLabels:
      app: loom-server
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
