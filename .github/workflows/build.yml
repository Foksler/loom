name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: Build CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - platform: linux-aarch64
            os: ubuntu-24.04-arm64
            target: aarch64-unknown-linux-gnu

          - platform: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin

          - platform: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin

          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build loom CLI
        run: cargo build --bin loom --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          exe_suffix=""
          if [[ "${{ matrix.platform }}" == "windows-x86_64" ]]; then
            exe_suffix=".exe"
          fi
          cp target/${{ matrix.target }}/release/loom${exe_suffix} out/${{ matrix.platform }}
          chmod +x out/${{ matrix.platform }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: out/${{ matrix.platform }}
          retention-days: 7

  build-server:
    name: Build Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build loom-server
        run: cargo build --bin loom-server --release

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x86_64
          path: target/release/loom-server
          retention-days: 7

  package:
    name: Package Release Bundle
    needs: [build-cli, build-server]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-linux-x86_64
          path: dist

      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/bin
          merge-multiple: true

      - name: Set permissions
        run: chmod +x dist/loom-server dist/bin/*

      - name: List contents
        run: |
          echo "=== Distribution contents ==="
          ls -laR dist/

      - name: Create tarball
        run: tar czf loom-bundle.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: loom-bundle
          path: loom-bundle.tar.gz
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            loom-bundle.tar.gz
            dist/bin/*
