name: Build and Publish Claude Code

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  build-and-push:
    name: Build & Push Claude Code Image
    runs-on: namespace-profile-cached-amd64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Dockerfile
        run: |
          curl -fsSL -o Dockerfile \
            https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/.devcontainer/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ghuntley/loom/claude-code:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
