name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Leptos CLI
        run: cargo install cargo-leptos --locked

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: crates/loom-web/package-lock.json

      - name: Install NPM dependencies
        run: |
          cd crates/loom-web
          npm ci

      - name: Install Playwright browsers
        run: |
          cd crates/loom-web
          npx playwright install --with-deps

      - name: Build Leptos app
        run: |
          cd crates/loom-web
          cargo leptos build --release
        env:
          LEPTOS_OUTPUT_NAME: loom_web

      - name: Run E2E tests
        run: |
          cd crates/loom-web
          npm run test:e2e
        timeout-minutes: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: crates/loom-web/playwright-report/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-videos-${{ matrix.node-version }}
          path: crates/loom-web/test-results/
          retention-days: 7

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const reportPath = 'crates/loom-web/playwright-report/index.html';
            
            if (fs.existsSync(reportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ E2E tests completed. [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)'
              });
            }
        continue-on-error: true
