[workspace]
resolver = "2"
members = [
    "crates/loom-config",
    "crates/loom-git",
    "crates/loom-github-app",
    "crates/loom-google-cse",
    "crates/loom-http-retry",
    "crates/loom-core",
    "crates/loom-thread",
    "crates/loom-server",
    "crates/loom-llm-anthropic",
    "crates/loom-llm-openai",
    "crates/loom-tools",
    "crates/loom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Geoffrey Huntley"]
license = "MIT"
repository = "https://github.com/ghuntley/loom"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Testing
proptest = "1"
tokio-test = "0.4"
tempfile = "3"

# Random (for jitter)
fastrand = "2"

# Bytes
bytes = "1"

# TOML parsing
toml = "0.8"

# Directories (for XDG)
dirs = "5"
