[workspace]
resolver = "2"
members = [
	"crates/loom-acp",
	"crates/loom-auth",
	"crates/loom-auth-devicecode",
	"crates/loom-auth-github",
	"crates/loom-auth-google",
	"crates/loom-auth-magiclink",
	"crates/loom-auth-okta",
	"crates/loom-cli-auto-commit",
	"crates/loom-cli",
	"crates/loom-config",
	"crates/loom-config-common",
	"crates/loom-core",
	"crates/loom-credentials",
	"crates/loom-git",
	"crates/loom-github-app",
	"crates/loom-google-cse",
	"crates/loom-http",
	"crates/loom-server-llm-anthropic",
	"crates/loom-server-llm-openai",
	"crates/loom-server-llm-proxy",
	"crates/loom-server-llm-service",
	"crates/loom-server-llm-vertex",
	"crates/loom-common-secret",
	"crates/loom-server",
	"crates/loom-thread",
	"crates/loom-tools",
	"crates/loom-version",
	"crates/loom-server-k8s",
	"crates/loom-weaver",
	"crates/loom-smtp",
	"crates/loom-i18n",
	"crates/loom-geoip",
	"crates/loom-server-jobs",
	"crates/loom-scm",
	"crates/loom-scm-mirror",
	"crates/loom-db",
	"crates/loom-server-api",
]

[workspace.package]
version = "0.1.0"
authors = ["Geoffrey Huntley"]
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/ghuntley/loom"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"
tokio-util = { version = "0.7", features = ["compat"] }

# HTTP types
http = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }
uuid7 = { version = "1", features = ["serde"] }

# Kubernetes
kube = { version = "0.98", features = ["runtime", "client", "derive", "ws"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }

# Cryptography
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

# Testing
proptest = "1"
tempfile = "3"
tokio-test = "0.4"

# Random (for jitter)
fastrand = "2"

# Bytes
bytes = "1"

# TOML parsing
toml = "0.8"

# Directories (for XDG)
dirs = "5"

# Secrets
zeroize = { version = "1", features = ["zeroize_derive"] }

# Crypto - password/token hashing
argon2 = "0.5"
rand = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }

# Internal crates
loom-auth-devicecode = { path = "crates/loom-auth-devicecode" }
loom-auth-magiclink = { path = "crates/loom-auth-magiclink" }
loom-config-common = { path = "crates/loom-config-common" }
loom-common-secret = { path = "crates/loom-common-secret" }
loom-version = { path = "crates/loom-version" }
loom-server-k8s = { path = "crates/loom-server-k8s" }
loom-geoip = { path = "crates/loom-geoip" }
loom-server-jobs = { path = "crates/loom-server-jobs" }

# Build profile optimizations for faster development builds
[profile.dev]
debug = 1                    # Reduced debug info (vs default 2)
split-debuginfo = "unpacked" # Faster linking with separate debug files
incremental = true           # Enable incremental compilation (default, explicit)

[profile.dev.package.loom-server]
codegen-units = 256          # More parallelism for the largest crate

[profile.dev.package.loom-server-api]
codegen-units = 128

# Fast profile for git hooks and quick iteration
[profile.dev-fast]
inherits = "dev"
debug = 0                    # No debug info for fastest builds
codegen-units = 512          # Maximum parallelism
incremental = true

# Release profile optimizations
[profile.release]
lto = "thin"                 # Faster than full LTO, still good optimization
codegen-units = 16
strip = "debuginfo"
