[workspace]
resolver = "2"
members = [
	"crates/loom-acp",
	"crates/loom-auto-commit",
	"crates/loom-cli",
	"crates/loom-config",
	"crates/loom-config-common",
	"crates/loom-core",
	"crates/loom-credentials",
	"crates/loom-git",
	"crates/loom-github-app",
	"crates/loom-google-cse",
	"crates/loom-http-retry",
	"crates/loom-llm-anthropic",
	"crates/loom-llm-openai",
	"crates/loom-llm-proxy",
	"crates/loom-llm-service",
	"crates/loom-llm-vertex",
	"crates/loom-secret",
	"crates/loom-server",
	"crates/loom-thread",
	"crates/loom-tools",
	"crates/loom-version",
]

[workspace.package]
version = "0.1.0"
authors = ["Geoffrey Huntley"]
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/ghuntley/loom"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"
tokio-util = { version = "0.7", features = ["compat"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Testing
proptest = "1"
tempfile = "3"
tokio-test = "0.4"

# Random (for jitter)
fastrand = "2"

# Bytes
bytes = "1"

# TOML parsing
toml = "0.8"

# Directories (for XDG)
dirs = "5"

# Secrets
zeroize = { version = "1", features = ["zeroize_derive"] }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }

# Internal crates
loom-config-common = { path = "crates/loom-config-common" }
loom-secret = { path = "crates/loom-secret" }
loom-version = { path = "crates/loom-version" }
