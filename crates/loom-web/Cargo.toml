[package]
name = "loom-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Leptos-based SPA for Loom AI coding assistant"

[dependencies]
# Leptos framework
leptos = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_router = { version = "0.7" }
leptos_axum = { version = "0.7" }

# Server framework (for SSR)
axum = { version = "0.8", features = ["macros"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Web APIs
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Window",
    "HtmlElement",
    "EventTarget",
    "EventSource",
    "MouseEvent",
    "KeyboardEvent",
    "File",
    "FileList",
    "DomRect",
] }

# Async runtime
tokio = { workspace = true, optional = true }
futures = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Config
dotenvy = "0.15"

# From workspace
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
loom-core = { path = "../loom-core" }

# Component extensions
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Markdown rendering (for code blocks, messages)
pulldown-cmark = "0.9"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }

# HTTP client (for non-streaming API calls if needed)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# URL encoding for API calls
urlencoding = "2.1"

# Icons (optional but recommended for UI)
icondata = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
proptest = { workspace = true }
gloo-utils = "0.2"

[[bin]]
name = "loom_web"
path = "src/main.rs"
required-features = ["hydrate"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["hydrate"]
hydrate = ["leptos/hydrate"]
ssr = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio", "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]
