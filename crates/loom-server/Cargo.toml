[package]
name = "loom-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server for Loom thread persistence"

[[bin]]
name = "loom-server"
path = "src/main.rs"

[lib]
name = "loom_server"
path = "src/lib.rs"

[dependencies]
futures = { workspace = true }
loom-jobs = { path = "../loom-jobs" }
loom-weaver = { path = "../loom-weaver" }
loom-core = { path = "../loom-core" }
loom-k8s = { path = "../loom-k8s" }
loom-secret = { path = "../loom-secret" }
loom-auth = { path = "../loom-auth" }
loom-auth-devicecode = { path = "../loom-auth-devicecode" }
loom-auth-github = { path = "../loom-auth-github" }
loom-auth-google = { path = "../loom-auth-google" }
loom-auth-magiclink = { path = "../loom-auth-magiclink" }
loom-auth-okta = { path = "../loom-auth-okta" }
loom-smtp = { path = "../loom-smtp" }
loom-i18n = { path = "../loom-i18n" }
loom-geoip = { path = "../loom-geoip" }
loom-github-app = { path = "../loom-github-app", features = ["openapi"] }
loom-google-cse = { path = "../loom-google-cse", features = ["openapi"] }
loom-llm-anthropic = { path = "../loom-llm-anthropic" }
loom-llm-service = { path = "../loom-llm-service" }
loom-thread = { path = "../loom-thread", features = ["openapi"] }
url = "2"
loom-version = { path = "../loom-version", features = ["serde", "utoipa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-stream = "0.1"

# HMAC for webhook verification
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
pin-project-lite.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# From workspace
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Config
dotenvy = "0.15"

# CLI
clap = { workspace = true }
humantime = "2"

# For LLM query detection
async-trait = { workspace = true }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Metrics
prometheus = "0.13"

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest.workspace = true
tempfile.workspace = true
tokio-test.workspace = true

