[package]
name = "loom-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server for Loom thread persistence"

[[bin]]
name = "loom-server"
path = "src/main.rs"

[lib]
name = "loom_server"
path = "src/lib.rs"

[dependencies]
futures = { workspace = true }
loom-core = { path = "../loom-core" }
loom-github-app = { path = "../loom-github-app" }
loom-google-cse = { path = "../loom-google-cse" }
loom-llm-service = { path = "../loom-llm-service" }
loom-thread = { path = "../loom-thread" }
loom-version = { path = "../loom-version", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-stream = "0.1"

# HMAC for webhook verification
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# From workspace
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Config
dotenvy = "0.15"

# CLI
clap = { workspace = true }
humantime = "2"

# For LLM query detection
async-trait = { workspace = true }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Metrics
prometheus = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest.workspace = true
tempfile.workspace = true
tokio-test.workspace = true

[[bench]]
name = "query_bridge_benchmarks"
harness = false
