[package]
name = "loom-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "0.9"
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { workspace = true }
ctrlc = "3"
futures = { workspace = true }
humantime = "2"
loom-acp = { path = "../loom-acp" }
loom-auto-commit = { path = "../loom-auto-commit" }
loom-config = { path = "../loom-config" }
loom-core = { path = "../loom-core" }
loom-git = { path = "../loom-git" }
loom-http = { path = "../loom-http" }
loom-llm-proxy = { path = "../loom-llm-proxy" }
loom-thread = { path = "../loom-thread" }
loom-tools = { path = "../loom-tools" }
loom-version = { workspace = true }
reqwest = { workspace = true }
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"
