[package]
name = "loom-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-config = { path = "../loom-config" }
loom-core = { path = "../loom-core" }
loom-tools = { path = "../loom-tools" }
loom-llm-proxy = { path = "../loom-llm-proxy" }
loom-thread = { path = "../loom-thread" }
loom-git = { path = "../loom-git" }
loom-http-retry = { path = "../loom-http-retry" }
loom-version = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
ctrlc = "3"
url = "2"
reqwest = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
