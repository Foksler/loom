[package]
name = "loom-llm-service"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-side LLM provider abstraction for Loom"

[dependencies]
loom-config-common.workspace = true
loom-core = { path = "../loom-core" }
loom-http-retry = { path = "../loom-http-retry" }
loom-llm-anthropic = { path = "../loom-llm-anthropic" }
loom-llm-openai = { path = "../loom-llm-openai" }
loom-llm-vertex = { path = "../loom-llm-vertex" }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
