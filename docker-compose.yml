  #     - "8080:8080"
  #   environment:
  #     - RUST_LOG=info
  #     - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/loom
  #   depends_on:
  #     - postgres
  #   networks:
  #     - loom-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #     interval: 30s
  #     timeout: 3s
  #     retries: 3
  #     start_period: 10s

  # PostgreSQL database (optional)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: loom-postgres
