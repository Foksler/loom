version: '3.8'

services:
  # Web UI - built from Dockerfile.web
  loom-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: loom-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    depends_on:
      - loom-server
    networks:
      - loom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Loom Server (API backend)
  # Uncomment and configure if running server in container
  # loom-server:
