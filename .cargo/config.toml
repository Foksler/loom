# Use mold linker for faster linking (especially for large binaries like loom-server)
# mold is available via Nix in devenv.nix

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS uses the default linker (mold not available)
# [target.x86_64-apple-darwin]
# [target.aarch64-apple-darwin]

[build]
# Cargo uses all available CPU cores by default
